# `cargo fmt` settings. Only stable options, so no nightly toolchain is needed.
edition = "2024"
# Wide lines, and short expressions (struct literals, calls, chains) kept on one
# line until they hit max_width rather than rustfmt's narrower defaults.
max_width = 120
use_small_heuristics = "Max"
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"
