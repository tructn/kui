<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>KUI</title>
    <script>
      // Match the splash to the last theme before any CSS or JS bundle loads.
      try {
        if (localStorage.getItem("kui-splash-theme") === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
    <!--
      Splash screen: shown while the JS bundle loads and settings are read.
      It lives inside #root, so React replaces it on first render. Styles are
      inline because index.css is part of the bundle that hasn't loaded yet.
    -->
    <style>
      html { background: #ffffff; color: #737373; }
      html.dark { background: #0a0a0a; color: #a3a3a3; }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font: 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        animation: splash-in 300ms ease-out both;
      }
      #splash img { width: 88px; height: 88px; }
      #splash .bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(115, 115, 115, 0.2);
      }
      #splash .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #f43f5e;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @keyframes splash-in {
        from { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .bar::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading KUI">
        <img src="/logo.svg" alt="" />
        <div class="bar"></div>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
