[package]
name = "kui_desktop"
version = "0.1.0-alpha.18"
description = "A desktop GUI for Apache Kafka"
authors = ["Truc Nguyen"]
license = "MIT"
repository = "https://github.com/tructn/kui"
edition = "2024"

[lib]
name = "kui_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable stays "kui": installed apps, the updater and e2e expect that name.
[[bin]]
name = "kui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
kui_tql = { workspace = true }
kui_kafka = { workspace = true }
# Used directly by the features; its build features are set in kui_kafka.
rdkafka = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
fake = { version = "5.1.0", features = ["uuid", "chrono", "random_color"] }
chrono = { workspace = true }

# In-app updates from GitHub releases. reqwest and rustls are the versions and
# TLS setup the updater already uses, so finding the newest release adds no
# second HTTP stack. The default "zip" feature only unpacks zipped Windows
# updates and Linux AppImages; KUI ships the .exe itself (release.yml)
# and macOS unpacks .app.tar.gz without it, so it's off, along with the zip
# crate and its advisories.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"

# Native "Save as" window for exports. Rust opens it, so the webview never gets
# dialog or file-system permissions (see security_tests.rs).
tauri-plugin-dialog = "2"

# Cluster passwords live in the OS credential store (macOS Keychain, Windows
# Credential Manager, Secret Service on Linux), not in clusters.json. On Linux
# it talks D-Bus through zbus in pure Rust, so the build needs no libdbus.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
