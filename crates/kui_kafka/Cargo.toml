[package]
name = "kui_kafka"
version = "0.1.0"
description = "KUI's Kafka layer: cluster config, clients, metadata, offsets and consumer groups"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# librdkafka and OpenSSL are linked statically, so the app has no runtime
# dependency on system Kafka/SSL libraries. OpenSSL is compiled from source
# except on Windows, where building it needs Perl. There it is linked from a
# prebuilt static OpenSSL found through the OPENSSL_* variables (the CI
# runner's preinstalled copy or vcpkg; see .github/actions/windows-openssl).
#
# curl-static adds librdkafka's built-in OAuth/OIDC token fetching (SASL
# OAUTHBEARER with sasl.oauthbearer.method=oidc). It is left out on Windows:
# rdkafka-sys expects a `libcurl.a` there, which an MSVC build doesn't produce.
[target.'cfg(not(windows))'.dependencies]
rdkafka = { workspace = true, features = ["cmake-build", "ssl-vendored", "zstd", "curl-static"] }

[target.'cfg(windows)'.dependencies]
rdkafka = { workspace = true, features = ["cmake-build", "ssl", "zstd"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
