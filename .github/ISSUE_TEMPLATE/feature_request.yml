name: Feature request
description: Suggest something KUI should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task, not the solution. "I want to find messages with a given key" beats "add a key filter".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could KUI help?
      description: What you'd like to see. Mockups or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
