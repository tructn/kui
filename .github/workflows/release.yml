# Releases KUI with release-please. See "Releasing" in CONTRIBUTING.md.
#
# release-please (https://github.com/googleapis/release-please) reads the
# Conventional Commits on main and keeps a "chore(main): release X" pull
# request open with the next version (package.json, Cargo.toml, Cargo.lock) and
# its CHANGELOG.md entry. Merging that PR releases the version: release-please
# tags the merge commit vX.Y.Z and creates a draft GitHub release with the
# changelog entry as its notes, the macOS and Windows installers are built, and
# the release is published once all of them are attached. A failed build leaves
# only the draft, which neither users nor the updater see. Versioning lives in
# release-please-config.json; SemVer pre-releases (v0.2.0-beta.1) become GitHub
# pre-releases, and a plain vX.Y.Z (v0.1.0 included) a normal release.
#
# Every release also carries latest.json, the manifest the app's updater reads
# (src-tauri/src/updates.rs), pointing at installers signed with the updater
# key (TAURI_SIGNING_PRIVATE_KEY secret; public key in tauri.conf.json).
#
# Manual run (Actions -> Release -> Run workflow): builds the installers from
# any branch as workflow artifacts only, without releasing anything.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a run may be halfway through publishing a release. A queued run
# replaced by a later push is harmless: release-please picks up any merged
# release PR it hasn't released yet.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write # labels on the release PR
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Pull requests opened with GITHUB_TOKEN don't run CI, so the release
          # PR gets no checks. Add a RELEASE_PLEASE_TOKEN secret (a fine-grained
          # PAT with contents and pull-requests write) to have them run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    name: ${{ matrix.name }}
    needs: release-please
    # On a manual run release-please is skipped, which would skip this job too.
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs aren't supported for now. To add them, build target
          # x86_64-apple-darwin on macos-latest and smoke-test it under Rosetta.
          # The app bundle is what the updater installs (as .app.tar.gz).
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # Without it the release has no signed update and installed apps never
      # see it. Re-run the failed jobs once the secret is added.
      - name: Check updater key
        if: env.TAG != ''
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          [ "$HAS_UPDATER_KEY" = true ] || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret; see CONTRIBUTING.md"; exit 1; }

      - uses: actions/checkout@v7
        with:
          # The tagged release commit; empty (the triggering ref) on a manual run.
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Bump prefix-key when a C dependency changes where it comes from (e.g.
      # OpenSSL vcpkg -> preinstalled): the cache keeps librdkafka's CMake
      # cache, which remembers absolute library paths from the old source.
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: ./.github/actions/windows-openssl
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Code signing is optional; see CONTRIBUTING.md. Missing secrets arrive as
      # empty strings, which Tauri would treat as "sign with an empty
      # certificate", so only export the ones that are set.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured; using ad-hoc signing."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No Windows certificate configured; installers will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Hand the thumbprint to Tauri through a config overlay so the base
          # config stays unsigned for local builds.
          $overlay = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $overlay
          "TAURI_SIGNING_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Signed update packages (.app.tar.gz and a .sig per installer) need
          # the updater key, so a manual run without it builds installers only.
          # "Check updater key" makes sure a release always has it.
          updater=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=true
          # TAURI_SIGNING_ARGS is unquoted on purpose: it holds two arguments.
          # shellcheck disable=SC2086
          bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater}}" $TAURI_SIGNING_ARGS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: kui-${{ matrix.target }}
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/macos/*.app.tar.gz*
            ${{ env.BUNDLE }}/nsis/*.exe*
          if-no-files-found: error

      # Signed SLSA provenance, verifiable with `gh attestation verify`.
      # Private repos only get attestations on GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: env.TAG != '' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/nsis/*.exe

  # One job publishes the release once every installer is built, so a failed
  # platform never leaves a half-filled release behind. Only this job can write.
  release:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # release-please wrote the version's CHANGELOG.md entry as the draft's
      # notes; drop its heading (the release has its own title).
      - name: Release notes
        run: |
          gh release view "$TAG" --json body --jq .body | sed -e '1{/^## /d;}' -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # The updater manifest: one entry per platform, with the update package's
      # signature.
      - name: Update manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            [ -f "$1" ] && [ -f "$1.sig" ] || { echo "::error::Missing update package or signature: ${1:-(none)}"; exit 1; }
            jq -n --arg sig "$(cat "$1.sig")" --arg url "$base/$(basename "$1")" '{signature: $sig, url: $url}'
          }
          app=$(entry "$(find installers -name '*.app.tar.gz')")
          nsis=$(entry "$(find installers -name '*-setup.exe')")
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "$RUNNER_TEMP/notes.md" --argjson app "$app" --argjson nsis "$nsis" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": $app, "darwin-aarch64-app": $app,
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis}}' \
            > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      # Artifacts keep their bundle subfolders (upload-artifact preserves paths
      # below the common ancestor), so collect files rather than globbing.
      # --clobber lets a re-run replace what a failed run uploaded.
      - name: Attach installers
        run: |
          # Signatures are already in latest.json; don't attach them separately.
          mapfile -t files < <(find installers -type f ! -name '*.sig')
          files+=("$RUNNER_TEMP/latest.json")
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # release-please marks every 0.x release a pre-release; only SemVer
      # pre-releases (a "-" suffix) should be one, and only the others "Latest".
      - name: Publish release
        run: |
          channel=(--prerelease=false --latest)
          [[ "$TAG" == *-* ]] && channel=(--prerelease --latest=false)
          gh release edit "$TAG" --draft=false --title "KUI $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${channel[@]}"
