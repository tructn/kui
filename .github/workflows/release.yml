# Builds KUI's installers. See "Releasing" in CONTRIBUTING.md.
#
# Merging a release PR (one that changes the version in package.json) into main
# releases that version: the macOS and Windows installers are built and
# published as a GitHub release, tagged vX.Y.Z on the merge commit, whose notes
# are the version's CHANGELOG.md section (git-cliff, see cliff.toml). Other
# pushes to main stop after the version check and build nothing. Pushing a v*
# tag by hand still works, for a release the automatic run didn't make.
# Versions follow SemVer: a pre-release suffix (v0.2.0-beta.1) makes a GitHub
# pre-release, and a plain vX.Y.Z (v0.1.0 included) a normal release.
#
# Every release also carries latest.json, the manifest the app's updater reads
# (src-tauri/src/updates.rs), pointing at installers signed with the updater
# key (TAURI_SIGNING_PRIVATE_KEY secret; public key in tauri.conf.json).
#
# Manual run (Actions -> Release -> Run workflow): builds the installers from
# any branch as workflow artifacts only, without releasing anything.
name: Release

on:
  push:
    branches: [main]
    # Only version bumps can release; tag pushes ignore this filter.
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Per commit, so a hand-pushed tag waits for the automatic run on the same
# commit (and then finds the release made), and a queued release on main is
# never replaced by a later push.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Decides what to release (the tag output; empty for none) and fails fast,
  # before 20+ minutes of builds, on a tag that doesn't match the version in
  # the files or a tag pushed on an unmerged commit.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: version
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          BEFORE: ${{ github.event.before }}
        run: |
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "package.json: $pkg, Cargo.toml: $cargo"
          [ "$pkg" = "$cargo" ] || { echo "::error::Versions differ; run scripts/set-version.sh"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push to main releases only when it changed the version, and
            # only once: a hand-pushed tag may have released it already.
            prev=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r .version || true)
            [ "$prev" != "$pkg" ] || { echo "Version unchanged ($pkg); nothing to release."; exit 0; }
            tag="v$pkg"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; nothing to release."
              exit 0
            fi
          else
            exit 0 # manual run: installers only
          fi
          # SemVer 2.0.0 without build metadata: vX.Y.Z or vX.Y.Z-<pre-release>.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?$"
          [[ "$tag" =~ $semver ]] || { echo "::error::Tag $tag isn't vX.Y.Z or vX.Y.Z-pre.N"; exit 1; }
          [ "$tag" = "v$pkg" ] || { echo "::error::Tag $tag doesn't match version $pkg"; exit 1; }
          grep -qF "## [$pkg] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no $pkg section; run scripts/set-version.sh $pkg"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag a commit on main"; exit 1; }
          # Without it the release has no signed update and installed apps never see it.
          [ "$HAS_UPDATER_KEY" = true ] || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret; see CONTRIBUTING.md"; exit 1; }
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: verify
    if: needs.verify.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs aren't supported for now. To add them, build target
          # x86_64-apple-darwin on macos-latest and smoke-test it under Rosetta.
          # The app bundle is what the updater installs (as .app.tar.gz).
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Bump prefix-key when a C dependency changes where it comes from (e.g.
      # OpenSSL vcpkg -> preinstalled): the cache keeps librdkafka's CMake
      # cache, which remembers absolute library paths from the old source.
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: ./.github/actions/windows-openssl
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Code signing is optional; see CONTRIBUTING.md. Missing secrets arrive as
      # empty strings, which Tauri would treat as "sign with an empty
      # certificate", so only export the ones that are set.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured; using ad-hoc signing."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No Windows certificate configured; installers will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Hand the thumbprint to Tauri through a config overlay so the base
          # config stays unsigned for local builds.
          $overlay = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $overlay
          "TAURI_SIGNING_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Signed update packages (.app.tar.gz and a .sig per installer) need
          # the updater key, so a manual run without it builds installers only.
          # verify makes sure a tag always has it.
          updater=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=true
          # TAURI_SIGNING_ARGS is unquoted on purpose: it holds two arguments.
          # shellcheck disable=SC2086
          bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater}}" $TAURI_SIGNING_ARGS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: kui-${{ matrix.target }}
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/macos/*.app.tar.gz*
            ${{ env.BUNDLE }}/nsis/*.exe*
          if-no-files-found: error

      # Signed SLSA provenance, verifiable with `gh attestation verify`.
      # Private repos only get attestations on GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: needs.verify.outputs.tag != '' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/nsis/*.exe

  # One job creates the release once every installer is built, so a failed
  # platform never leaves a half-filled release behind. Only this job can write.
  release:
    needs: [verify, build]
    if: needs.verify.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      # Full history and tags, for git-cliff to find the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # The changes since the previous tag, as in CHANGELOG.md, minus the
      # version heading (the release has its own title). On a merge to main the
      # tag doesn't exist yet: tag the commit locally so git-cliff sees it.
      - name: Release notes
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG" "$GITHUB_SHA"
          bunx git-cliff --current --strip all | sed -e '1{/^## /d;}' -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # The updater manifest: one entry per platform, with the update package's
      # signature.
      - name: Update manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            [ -f "$1" ] && [ -f "$1.sig" ] || { echo "::error::Missing update package or signature: ${1:-(none)}"; exit 1; }
            jq -n --arg sig "$(cat "$1.sig")" --arg url "$base/$(basename "$1")" '{signature: $sig, url: $url}'
          }
          app=$(entry "$(find installers -name '*.app.tar.gz')")
          nsis=$(entry "$(find installers -name '*-setup.exe')")
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "$RUNNER_TEMP/notes.md" --argjson app "$app" --argjson nsis "$nsis" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": $app, "darwin-aarch64-app": $app,
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis}}' \
            > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      # Only SemVer pre-releases (a "-" suffix) are marked as pre-releases. Artifacts
      # keep their bundle subfolders (upload-artifact preserves paths below the
      # common ancestor), so collect files rather than globbing.
      # --target creates the tag on the built commit when it doesn't exist yet;
      # a tag made with GITHUB_TOKEN doesn't trigger this workflow again.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          # Signatures are already in latest.json; don't attach them separately.
          mapfile -t files < <(find installers -type f ! -name '*.sig')
          files+=("$RUNNER_TEMP/latest.json")
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "KUI $TAG" "${prerelease[@]}"
