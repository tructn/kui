# Checks for pull requests and for pushes to main:
# - lint and unit tests on Linux, on both (main also gets direct pushes);
# - the app must compile on macOS (Apple Silicon and Intel) and Windows, the
#   platforms we ship, so that platform-only breakage (e.g. the Windows OpenSSL
#   setup) shows up before a release rather than during one. This runs on main
#   too, because most work is pushed there directly and would otherwise first
#   meet macOS and Windows in the release PR. Installers are built only by
#   release.yml.
#
# The e2e suite (`bun run test:e2e`) runs locally, not here. Dependency audits
# are in security.yml, and the PR title check in pr-title.yml.
#
# Docs-only pushes to main skip CI. PRs never use path filters: a required check
# whose workflow didn't run stays pending and blocks the merge.
#
# PR title edits don't trigger this workflow at all. If they did, its jobs would
# have to be skipped for them, and a skipped required check counts as passed:
# it could replace a failed result for the same commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

# A new push to a PR cancels its outdated run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # Only main saves: PR caches can't be restored by other PRs and would
      # crowd main's out of the repo's 10 GB cache budget.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri's Linux webview, and CMake + headers for the bundled librdkafka
      # (its OAuth code includes curl.h even when built without curl).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcurl4-openssl-dev zlib1g-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - run: bun install --frozen-lockfile

      # Type-checks the UI; `generate_context!` also needs the built dist/.
      - run: bun run build

      # Same checks as the git hooks (lefthook.yml), for commits made with --no-verify.
      - name: Format and lint
        run: bun run lint

      - name: UI tests
        run: bun test frontend

      # Includes the guards for the OWASP controls (crates/kui_desktop/src/security_tests.rs).
      - name: Rust tests
        run: cargo test --locked --lib

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three platforms release.yml ships (Apple Silicon, Intel Mac, Windows).
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Bump prefix-key when a C dependency changes where it comes from (e.g.
      # OpenSSL vcpkg -> preinstalled): the cache keeps librdkafka's CMake
      # cache, which remembers absolute library paths from the old source.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/windows-openssl
        if: runner.os == 'Windows'

      - run: bun install --frozen-lockfile

      # `generate_context!` embeds dist/, so the UI must be built first.
      - run: bun run build

      - name: Compile and test
        run: cargo test --locked --lib
