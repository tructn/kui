# Dependency advisories: GitHub's (bun audit) for the UI, RustSec's (cargo
# audit) for the app. Runs weekly too, because new advisories appear without
# any code change. Only the lockfiles are read, so nothing is built here.
# The same job scans the full git history for committed secrets (gitleaks).
#
# Tests, including the guards for the OWASP controls (crates/kui_desktop/src/security_tests.rs),
# run in ci.yml.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its outdated run; runs on main always finish.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is a required check on main; keep it.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,gitleaks

      - name: Audit dependencies
        run: bun run audit

      - name: Scan history for secrets
        run: gitleaks git --redact --verbose
