# Security checks: guard tests for the OWASP controls,
# behavioural tests, and dependency advisories (rustsec, GitHub advisories).
# Runs weekly too, because new advisories appear without any code change.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its outdated run; runs on main always finish.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux webview, and CMake + headers for the bundled librdkafka
      # (its OAuth code includes curl.h even when built without curl).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcurl4-openssl-dev zlib1g-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: bun install --frozen-lockfile

      # The Rust tests read the built UI's config only, but `generate_context!` needs dist/.
      - run: bun run build

      # Same checks as the pre-commit / pre-push hooks (lefthook.yml), for commits made with --no-verify.
      - name: Format and lint
        run: bun run lint

      - name: Guard tests, unit tests and dependency audits
        run: bun run security
