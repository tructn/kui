# Local Kafka for development and testing.
#
#   docker compose up -d                          Kafka on localhost:9092 + demo data
#   bun run test:e2e                              full end-to-end test run
#   docker compose down                           stop and remove everything
#
# Kafka has two listeners because a broker tells clients which address to
# reconnect to: your Mac must use localhost:9092, other containers kafka:29092.
name: kui

services:
  kafka:
    image: apache/kafka:latest
    container_name: kui-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  # Schema Registry for decoding Avro/Protobuf/JSON Schema messages: in KUI,
  # set the cluster's Schema Registry URL to http://localhost:8081.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: kui-schema-registry
    # Its first start can lose a race creating the _schemas topic; a restart fixes it.
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: curl -sf http://localhost:8081/subjects > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates demo topics, messages and a consumer group with lag. Safe to re-run.
  kafka-seed:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka-seed.sh:/kafka-seed.sh:ro
    entrypoint: ["bash", "/kafka-seed.sh"]

  # Builds the app on Linux and drives it with WebdriverIO + tauri-driver.
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      kafka-seed:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      # Cache Rust builds between runs (librdkafka takes minutes to compile).
      - cargo-target:/app/src-tauri/target
      - cargo-registry:/usr/local/cargo/registry
      # Screenshots of failed tests.
      - ./e2e/artifacts:/app/e2e/artifacts

volumes:
  cargo-target:
  cargo-registry:
