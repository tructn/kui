# Local Kafka for development and testing.
#
#   docker compose up -d                          Kafka on localhost:9092 + demo data
#   docker compose --profile connect up -d        also Kafka Connect on localhost:8083 with the
#                                                 Confluent HTTP Sink, to publish pipelines to
#   bun run test:e2e                              full end-to-end test run (own fresh Kafka)
#   docker compose down                           stop and remove everything
#
# Kafka has two listeners because a broker tells clients which address to
# reconnect to: your Mac must use localhost:9092, other containers kafka:29092.
name: kui

services:
  kafka:
    image: apache/kafka:latest
    container_name: kui-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: creates demo topics, messages and a consumer group with lag. Safe to re-run.
  kafka-seed:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka-seed.sh:/kafka-seed.sh:ro
    entrypoint: ["bash", "/kafka-seed.sh"]

  # Kafka Connect for trying "Publish to Kafka Connect" locally. In KUI use http://localhost:8083,
  # bootstrap servers kafka:29092 and replication factor 1. A webhook on your Mac is
  # http://host.docker.internal:<port> from inside the container.
  connect:
    profiles: ["connect"]
    image: confluentinc/cp-kafka-connect:7.9.0
    container_name: kui-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: kui-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _kui-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _kui-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _kui-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    # The HTTP Sink isn't in the image; installing it on start keeps this file the only setup.
    # 1.7.10 is pinned because later releases no longer bundle Confluent's licensing classes, and
    # fail to start on this image with NoClassDefFoundError: io/confluent/license/...
    command:
      - bash
      - -c
      - confluent-hub install --no-prompt confluentinc/kafka-connect-http:1.7.10 && /etc/confluent/docker/run

  # Builds the app on Linux and drives it with WebdriverIO + tauri-driver.
  # The e2e run gets its own throwaway Kafka on a private network, so specs see
  # exactly the seeded data no matter what was produced to the dev broker above.
  # `bun run test:e2e` removes it first, so every run starts fresh.
  kafka-e2e:
    profiles: ["e2e"]
    image: apache/kafka:latest
    networks:
      e2e:
        aliases: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-seed-e2e:
    profiles: ["e2e"]
    image: apache/kafka:latest
    networks: [e2e]
    depends_on:
      kafka-e2e:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka-seed.sh:/kafka-seed.sh:ro
    entrypoint: ["bash", "/kafka-seed.sh"]

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    networks: [e2e]
    depends_on:
      kafka-seed-e2e:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      # Cache Rust builds between runs (librdkafka takes minutes to compile).
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
      # Screenshots of failed tests.
      - ./e2e/artifacts:/app/e2e/artifacts

networks:
  e2e:

volumes:
  cargo-target:
  cargo-registry:
