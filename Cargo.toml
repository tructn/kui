# The Rust workspace: the Tauri app (crates/kui_desktop) and the crates it is
# built from (crates/*). Run cargo from here; Cargo.lock and target/ live here too.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# Build features (static linking, TLS, compression) are set in crates/kui_kafka.
rdkafka = "0.39"
kui_mql = { path = "crates/kui_mql" }
kui_kafka = { path = "crates/kui_kafka" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
