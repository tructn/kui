# git-cliff config for CHANGELOG.md and the GitHub release notes.
# See "Releasing" in CONTRIBUTING.md. Entries come from the squash-merged PR
# titles on main, so only user-visible types (feat, fix, perf, revert) and
# breaking changes are listed; the rest is left out.

[changelog]
header = """
# Changelog

All notable changes to KUI are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) from the commit
history; run `scripts/set-version.sh` rather than editing it by hand.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% if not previous or not previous.version %}
First public release.
{% elif commits | filter(attribute="group") | length == 0 %}
No user-visible changes.
{% endif -%}
{% for group, commits in commits | filter(attribute="group") | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
# Link definitions for the headings; the last one has no newline because
# git-cliff ends the file with one.
footer = """
{% for release in releases -%}
{% if not loop.first %}
{% endif -%}
{% if not release.version -%}
[unreleased]: https://github.com/tructn/kui/compare/{{ release.previous.version }}...HEAD\
{% elif release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/tructn/kui/compare/{{ release.previous.version }}...{{ release.version }}\
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/tructn/kui/releases/tag/{{ release.version }}\
{% endif -%}
{% endfor %}"""
trim = false
# Link "(#12)" PR references from squash-merge titles.
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tructn/kui/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
tag_pattern = "^v[0-9]"
sort_commits = "oldest"
# The <!-- N --> prefixes order the groups; striptags removes them.
commit_parsers = [
  { message = "^[a-z]+(\\(.*\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(security\\)", group = "<!-- 1 -->Security" },
  { message = "^feat", group = "<!-- 2 -->Added" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = ".*", skip = true },
]
